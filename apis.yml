aid: pointonenav
name: Pointonenav
description: >-
  Point One Navigation provides precision location technology for autonomous
  systems and vehicles, delivering centimeter-level accuracy even in challenging
  environments. Its core offerings are the Polaris RTK/SSR corrections network — a
  globally distributed network of thousands of base stations across the US, UK,
  EU, Korea, Australia, New Zealand, and Japan with 99% uptime — and the
  FusionEngine sensor-fusion positioning software for dead reckoning where open-sky
  GNSS is unavailable. Developers integrate via a GraphQL API for workflow and data
  management, an NTRIP/RTCM corrections stream, and open-source FusionEngine and
  Polaris client libraries. Point One is a portfolio company of Khosla Ventures.
